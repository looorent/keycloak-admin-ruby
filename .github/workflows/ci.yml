# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby-version }} / Keycloak ${{ matrix.keycloak-version }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.1', '3.2', '3.3', '3.4']
        keycloak-version: ['19.0', '21.0', '23.0', '25.0', '26.7.0']

    steps:
    - name: Start Keycloak
      run: |
        docker run -d --name keycloak -p 8080:8080 \
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
          -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
          -e KEYCLOAK_ADMIN=admin \
          -e KEYCLOAK_ADMIN_PASSWORD=admin \
          -e KC_HOSTNAME=http://localhost:8080 \
          -e KC_HOSTNAME_ADMIN=http://localhost:8080 \
          -e KC_HTTP_ENABLED=true \
          -e KC_DB=dev-file \
          -e KC_HOSTNAME_STRICT=false \
          -e KC_HOSTNAME_STRICT_HTTPS=false \
          quay.io/keycloak/keycloak:${{ matrix.keycloak-version }} \
          start-dev

    - name: Wait for Keycloak to be ready
      run: |
        for i in $(seq 1 30); do
          if curl --silent --fail http://localhost:8080/realms/master > /dev/null; then
            echo "Keycloak is ready"
            exit 0
          fi
          sleep 5
        done
        echo "Keycloak did not become ready in time"
        docker logs keycloak
        exit 1



    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run unit tests
      run: bundle exec rake spec
    - name: Run integration tests
      run: bundle exec rake integration

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true
    - name: Check dependencies against the Ruby advisory database
      run: bundle exec bundle-audit check --update
